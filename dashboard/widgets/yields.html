<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #f0f4f8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      height: 100vh;
      gap: 8px;
      padding: 8px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .maturity {
      font-size: 11px;
      color: #9ca3af;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    .name {
      font-size: 12px;
      color: #374151;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .value {
      font-size: 38px;
      font-weight: 800;
      color: #111827;
      line-height: 1;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }
    .value.loading { font-size: 24px; color: #d1d5db; }
    .change {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .up   { color: #dc2626; background: #fef2f2; }
    .down { color: #16a34a; background: #f0fdf4; }
    .flat { color: #6b7280; background: #f3f4f6; }
    .footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      text-align: center;
      font-size: 10px;
      color: #9ca3af;
      padding: 4px;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <div class="maturity">US 2YR</div>
      <div class="name">미국 2년물 국채</div>
      <div class="value loading" id="v2">—</div>
      <div class="change flat" id="ch2">로딩 중…</div>
    </div>
    <div class="card">
      <div class="maturity">US 5YR</div>
      <div class="name">미국 5년물 국채</div>
      <div class="value loading" id="v5">—</div>
      <div class="change flat" id="ch5">로딩 중…</div>
    </div>
    <div class="card">
      <div class="maturity">US 10YR</div>
      <div class="name">미국 10년물 국채</div>
      <div class="value loading" id="v10">—</div>
      <div class="change flat" id="ch10">로딩 중…</div>
    </div>
    <div class="card">
      <div class="maturity">US 30YR</div>
      <div class="name">미국 30년물 국채</div>
      <div class="value loading" id="v30">—</div>
      <div class="change flat" id="ch30">로딩 중…</div>
    </div>
  </div>
  <div class="footer" id="footer">데이터 로딩 중…</div>

  <script>
    const FIELDS = [
      { localName: 'BC_2YEAR',  vid: 'v2',  cid: 'ch2'  },
      { localName: 'BC_5YEAR',  vid: 'v5',  cid: 'ch5'  },
      { localName: 'BC_10YEAR', vid: 'v10', cid: 'ch10' },
      { localName: 'BC_30YEAR', vid: 'v30', cid: 'ch30' },
    ];

    // XML 네임스페이스(m:, d: 등) 무시하고 localName으로 탐색
    function byLocal(root, name) {
      for (const el of root.querySelectorAll('*')) {
        if (el.localName === name) return el;
      }
      return null;
    }
    function allByLocal(doc, name) {
      return [...doc.querySelectorAll('*')].filter(el => el.localName === name);
    }

    // CORS 프록시 fallback 순서
    const PROXIES = [
      url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    ];

    async function fetchMonth(yyyymm) {
      const target = `https://home.treasury.gov/resource-center/data-chart-center/interest-rates/pages/xml?data=daily_treasury_yield_curve&field_tdr_date_value=${yyyymm}`;

      for (const makeProxy of PROXIES) {
        try {
          const res = await fetch(makeProxy(target));
          if (!res.ok) continue;
          const text = await res.text();
          // 에러 HTML 페이지 걸러내기 — XML이면 반드시 'properties' 문자열 포함
          if (!text || !text.includes('properties')) continue;
          const xml = new DOMParser().parseFromString(text, 'text/xml');
          const entries = allByLocal(xml, 'properties');
          if (entries.length > 0) return entries;
        } catch (_) { /* 다음 프록시 시도 */ }
      }
      return [];
    }

    async function load() {
      try {
        const now = new Date();
        const y = now.getFullYear(), m = now.getMonth() + 1;
        const curYM  = `${y}${String(m).padStart(2, '0')}`;
        const prevDate = new Date(y, m - 2, 1);
        const prevYM = `${prevDate.getFullYear()}${String(prevDate.getMonth() + 1).padStart(2, '0')}`;

        let entries = await fetchMonth(curYM);
        // 월초라 당월 데이터 부족하면 전월 보완
        if (entries.length < 2) {
          const prev = await fetchMonth(prevYM);
          entries = [...prev, ...entries];
        }
        if (entries.length === 0) throw new Error('모든 프록시에서 데이터 없음');

        const latest = entries[entries.length - 1];
        const before = entries.length >= 2 ? entries[entries.length - 2] : null;

        const dateEl = byLocal(latest, 'NEW_DATE');
        const rawDate = dateEl ? dateEl.textContent.split('T')[0] : '';
        document.getElementById('footer').textContent =
          `기준일: ${rawDate} · 출처: 미국 재무부 · 30분마다 자동 갱신`;

        FIELDS.forEach(({ localName, vid, cid }) => {
          const curEl = byLocal(latest, localName);
          const preEl = before ? byLocal(before, localName) : null;
          const cur = curEl ? parseFloat(curEl.textContent) : NaN;
          const pre = preEl ? parseFloat(preEl.textContent) : NaN;

          const vEl = document.getElementById(vid);
          vEl.textContent = isNaN(cur) ? 'N/A' : `${cur.toFixed(2)}%`;
          vEl.classList.remove('loading');

          const chEl = document.getElementById(cid);
          if (!isNaN(cur) && !isNaN(pre)) {
            const bp = Math.round((cur - pre) * 100);
            const sign = bp > 0 ? '+' : '';
            chEl.textContent = `${sign}${bp}bp 전일 대비`;
            chEl.className = `change ${bp > 0 ? 'up' : bp < 0 ? 'down' : 'flat'}`;
          } else {
            chEl.textContent = '전일 대비 —';
            chEl.className = 'change flat';
          }
        });

      } catch (e) {
        console.error('yields:', e);
        document.getElementById('footer').textContent = `로드 실패: ${e.message}`;
        FIELDS.forEach(({ vid, cid }) => {
          const vEl = document.getElementById(vid);
          vEl.textContent = 'N/A';
          vEl.classList.remove('loading');
          document.getElementById(cid).textContent = '재시도 중…';
          document.getElementById(cid).className = 'change flat';
        });
      }
    }

    load();
    setInterval(load, 30 * 60 * 1000);
  </script>
</body>
</html>
