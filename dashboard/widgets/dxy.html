<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="widget" allowtransparency="true"></iframe>
  <script>
    const config = {
      colorTheme: "light",
      dateRange: "1M",
      isTransparent: false,
      showFloatingTooltip: false,
      plotLineColorGrowing: "rgba(41, 98, 255, 1)",
      plotLineColorFalling: "rgba(41, 98, 255, 1)",
      gridLineColor: "rgba(240, 243, 250, 0)",
      scaleFontColor: "#0F0F0F",
      belowLineFillColorGrowing: "rgba(41, 98, 255, 0.12)",
      belowLineFillColorFalling: "rgba(41, 98, 255, 0.12)",
      belowLineFillColorGrowingBottom: "rgba(41, 98, 255, 0)",
      belowLineFillColorFallingBottom: "rgba(41, 98, 255, 0)",
      symbolActiveColor: "rgba(41, 98, 255, 0.12)",
      tabs: [{
        title: "매크로 지표",
        symbols: [
          { s: "TVC:DXY",   d: "달러 인덱스 (DXY)" },
          { s: "TVC:GOLD",  d: "금 (Gold)" },
          { s: "TVC:USOIL", d: "WTI 원유" },
          { s: "TVC:SILVER",d: "은 (Silver)" }
        ]
      }]
    };
    document.getElementById('widget').src =
      'https://s.tradingview.com/embed-widget/market-overview/?locale=kr#' +
      encodeURIComponent(JSON.stringify(config));
  </script>
</body>
</html>
