<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .title {
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }
    .gauge-wrap { position: relative; width: 220px; height: 120px; }
    svg { overflow: visible; }
    .gauge-value {
      font-size: 36px;
      font-weight: 700;
      color: #333;
      text-align: center;
      margin-top: 6px;
      line-height: 1;
    }
    .gauge-label {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-top: 4px;
      font-weight: 500;
    }
    .update-time {
      font-size: 11px;
      color: #999;
      text-align: center;
      margin-top: 6px;
    }
    .error { color: #e74c3c; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <div class="title">공포탐욕지수 (CNN FEAR &amp; GREED)</div>
  <div class="gauge-wrap">
    <svg width="220" height="120" viewBox="0 0 220 120">
      <defs>
        <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#e74c3c"/>
          <stop offset="25%"  stop-color="#e67e22"/>
          <stop offset="50%"  stop-color="#f1c40f"/>
          <stop offset="75%"  stop-color="#2ecc71"/>
          <stop offset="100%" stop-color="#27ae60"/>
        </linearGradient>
      </defs>
      <!-- background track -->
      <path d="M 20 110 A 90 90 0 0 1 200 110" fill="none" stroke="#eee" stroke-width="18" stroke-linecap="round"/>
      <!-- colored arc -->
      <path d="M 20 110 A 90 90 0 0 1 200 110" fill="none" stroke="url(#gaugeGrad)" stroke-width="18" stroke-linecap="round"/>
      <!-- needle -->
      <line id="needle" x1="110" y1="110" x2="110" y2="30" stroke="#333" stroke-width="2.5" stroke-linecap="round" transform="rotate(0, 110, 110)"/>
      <circle cx="110" cy="110" r="5" fill="#333"/>
    </svg>
  </div>
  <div class="gauge-value" id="fngValue">--</div>
  <div class="gauge-label" id="fngLabel">로딩 중...</div>
  <div class="update-time" id="updateTime"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const h = parseInt(params.get('h') || 320);
    document.body.style.height = h + 'px';

    const labelMap = {
      'Extreme Fear': '극단적 공포',
      'Fear': '공포',
      'Neutral': '중립',
      'Greed': '탐욕',
      'Extreme Greed': '극단적 탐욕'
    };

    function setNeedle(value) {
      const angle = -90 + (value / 100) * 180;
      document.getElementById('needle').setAttribute('transform', `rotate(${angle}, 110, 110)`);
    }

    async function fetchFNG() {
      try {
        const res = await fetch('https://api.alternative.me/fng/?limit=1&format=json');
        const data = await res.json();
        const item = data.data[0];
        const val = parseInt(item.value);
        const cls = item.value_classification;

        document.getElementById('fngValue').textContent = val;
        document.getElementById('fngLabel').textContent = labelMap[cls] || cls;

        const now = new Date();
        const timeStr = now.toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
        document.getElementById('updateTime').textContent = '업데이트: ' + timeStr;

        setNeedle(val);
      } catch (e) {
        document.getElementById('fngLabel').innerHTML = '<span class="error">데이터 로드 실패</span>';
      }
    }

    fetchFNG();
    setInterval(fetchFNG, 5 * 60 * 1000);
  </script>
</body>
</html>
