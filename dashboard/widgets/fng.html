<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; padding: 24px;
  }
  .title { font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 20px; }
  .gauge-wrap { position: relative; width: 220px; height: 120px; }
  .fng-num { font-size: 52px; font-weight: 700; text-align: center; margin: 16px 0 6px; }
  .fng-lbl { font-size: 18px; color: #555; text-align: center; font-weight: 500; }
  .scale {
    display: flex; justify-content: space-between;
    width: 220px; margin-top: 10px;
    font-size: 11px; color: #999;
  }
  .updated { font-size: 11px; color: #bbb; margin-top: 16px; }
</style>
</head>
<body>
<div class="title">공포탐욕지수 (CNN Fear &amp; Greed)</div>

<svg viewBox="0 0 220 120" width="220" height="120">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e53935"/>
      <stop offset="25%"  stop-color="#fb8c00"/>
      <stop offset="50%"  stop-color="#fdd835"/>
      <stop offset="75%"  stop-color="#7cb342"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <!-- 배경 호 -->
  <path d="M20 110 A90 90 0 0 1 200 110" fill="none" stroke="#f0f0f0" stroke-width="18" stroke-linecap="round"/>
  <!-- 그라데이션 배경 -->
  <path d="M20 110 A90 90 0 0 1 200 110" fill="none" stroke="url(#g)" stroke-width="18" stroke-linecap="round" opacity=".25"/>
  <!-- 활성 호 -->
  <path id="arc" d="M20 110 A90 90 0 0 1 200 110" fill="none" stroke="#fdd835" stroke-width="18"
        stroke-linecap="round" stroke-dasharray="283" stroke-dashoffset="142"/>
  <!-- 바늘 -->
  <line id="needle" x1="110" y1="110" x2="110" y2="30"
        stroke="#333" stroke-width="3" stroke-linecap="round" transform="rotate(0 110 110)"/>
  <circle cx="110" cy="110" r="7" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <!-- 눈금 레이블 -->
  <text x="14" y="128" fill="#e53935" font-size="11" font-family="sans-serif">공포</text>
  <text x="174" y="128" fill="#2e7d32" font-size="11" font-family="sans-serif">탐욕</text>
</svg>

<div class="fng-num" id="fng-num" style="color:#fdd835">—</div>
<div class="fng-lbl" id="fng-lbl">로딩 중...</div>
<div class="updated" id="updated"></div>

<script>
const COLOR = v => v<=24?'#e53935':v<=44?'#fb8c00':v<=55?'#fdd835':v<=74?'#7cb342':'#2e7d32';
const KR = {'Extreme Fear':'극단적 공포','Fear':'공포','Neutral':'중립','Greed':'탐욕','Extreme Greed':'극단적 탐욕'};

function setGauge(v) {
  const color  = COLOR(v);
  const arcLen = 283;
  const offset = arcLen * (1 - v / 100);
  const angle  = -90 + v * 1.8;

  document.getElementById('arc').setAttribute('stroke', color);
  document.getElementById('arc').setAttribute('stroke-dashoffset', offset);
  document.getElementById('needle').setAttribute('transform', `rotate(${angle} 110 110)`);

  const num = document.getElementById('fng-num');
  num.textContent = v;
  num.style.color = color;
}

async function load() {
  try {
    // CNN Fear & Greed
    const res = await fetch('https://production.dataviz.cnn.io/index/fearandgreed/graphdata', {
      headers: {
        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
        'Referer': 'https://edition.cnn.com/',
      }
    });
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    setGauge(Math.round(d.fear_and_greed.score));
    document.getElementById('fng-lbl').textContent = KR[d.fear_and_greed.rating] || d.fear_and_greed.rating;
  } catch {
    // 대체: alternative.me
    const d = await fetch('https://api.alternative.me/fng/?limit=1').then(r=>r.json());
    setGauge(parseInt(d.data[0].value));
    document.getElementById('fng-lbl').textContent = KR[d.data[0].value_classification] || d.data[0].value_classification;
  }
  document.getElementById('updated').textContent = '업데이트: ' + new Date().toLocaleTimeString('ko-KR');
}

load();
setInterval(load, 5 * 60 * 1000);
</script>
</body></html>
