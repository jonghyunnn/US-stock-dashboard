<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; overflow: hidden; background: #fff; }
    iframe { width: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="widget" src="https://s.tradingview.com/embed-widget/single-quote/?locale=kr#%7B%22symbol%22%3A%22FX_IDC%3AUSDKRW%22%2C%22colorTheme%22%3A%22light%22%7D" allowtransparency="true"></iframe>
  <script>
    const h = new URLSearchParams(window.location.search).get('h') || 180;
    document.getElementById('widget').style.height = h + 'px';
    document.body.style.height = h + 'px';
  </script>
</body>
</html>
